name: Build e Publicacao da Aplicacao

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/app-ci.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag de versão da imagem (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir t da imagem
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag || 'v1.0.0' }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build e Push do Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/todoapp-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/todoapp-frontend:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/todoapp-frontend:latest

      - name: Build e Push do Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/todoapp-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/todoapp-backend:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/todoapp-backend:latest
