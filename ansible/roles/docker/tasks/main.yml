---
- name: Instalar Docker
  ansible.builtin.dnf:
    name: docker
    state: present

- name: Habilitar e iniciar serviço Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Adicionar ec2-user ao grupo docker
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true

- name: Criar diretório de plugins do Docker CLI
  ansible.builtin.file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    mode: "0755"

- name: Instalar Docker Compose v2
  ansible.builtin.get_url:
    url: https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    mode: "0755"
